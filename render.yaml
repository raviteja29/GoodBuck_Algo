services:
  - type: web
    name: goodbuck-algo
    env: node
    buildCommand: npm install && cd premiumtrader-backend && npm install && cd .. && npx vite build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Secrets: set these in the Render dashboard (Environment tab), never in git.
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
